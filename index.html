<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>台股本益比選股</title>
<style>
  :root {
    --bg: #0b0f14; --panel: #121821; --line: #1f2a36; --text: #d7dee7; --dim: #7d8a99;
    --up: #ff4d4f; --down: #26c281; --accent: #f5b301; --row: #0f151d;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.45 "Segoe UI", "Microsoft JhengHei", system-ui, sans-serif; }
  header { display: flex; align-items: center; gap: 16px; padding: 14px 22px;
    border-bottom: 1px solid var(--line); background: var(--panel); }
  header h1 { margin: 0; font-size: 18px; letter-spacing: .5px; }
  header h1 span { color: var(--accent); }
  .date { margin-left: auto; color: var(--dim); font-size: 13px; }
  .ticker { overflow: hidden; white-space: nowrap; border-bottom: 1px solid var(--line);
    background: #0d131a; font-variant-numeric: tabular-nums; font-size: 13px; }
  .ticker-inner { display: inline-block; padding: 7px 0; animation: scroll 120s linear infinite; }
  .ticker-inner b { margin: 0 6px 0 22px; font-weight: 600; }
  @keyframes scroll { from { transform: translateX(0); } to { transform: translateX(-50%); } }
  main { padding: 18px 22px; max-width: 1400px; margin: 0 auto; }
  .stats { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 12px; margin-bottom: 16px; }
  .stat { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; }
  .stat .k { color: var(--dim); font-size: 12px; }
  .stat .v { font-size: 24px; font-weight: 600; font-variant-numeric: tabular-nums; margin-top: 2px; }
  .controls { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; background: var(--panel);
    border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; margin-bottom: 16px; }
  .controls label { color: var(--dim); font-size: 13px; display: flex; align-items: center; gap: 8px; }
  input[type=range] { accent-color: var(--accent); width: 180px; }
  .pe-val { color: var(--accent); font-weight: 700; font-size: 16px; min-width: 52px; font-variant-numeric: tabular-nums; }
  input[type=search], input[type=number], select { background: var(--bg); color: var(--text);
    border: 1px solid var(--line); border-radius: 6px; padding: 6px 9px; font: inherit; }
  input[type=search] { width: 190px; }
  input[type=number] { width: 72px; }
  .hist { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px 8px; margin-bottom: 16px; }
  .hist h3 { margin: 0 0 8px; font-size: 13px; color: var(--dim); font-weight: 500; }
  .bars { display: flex; align-items: flex-end; gap: 3px; height: 90px; }
  .bar { flex: 1; background: #2a3644; border-radius: 2px 2px 0 0; position: relative; cursor: default; }
  .bar.on { background: var(--accent); }
  .bar:hover::after { content: attr(data-tip); position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%);
    background: #000; color: #fff; font-size: 11px; padding: 3px 6px; border-radius: 4px; white-space: nowrap; margin-bottom: 4px; z-index: 2; }
  .axis { display: flex; justify-content: space-between; color: var(--dim); font-size: 11px; margin-top: 4px; }
  .tablewrap { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; overflow: auto; max-height: 70vh; }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th, td { padding: 8px 12px; text-align: right; white-space: nowrap; }
  th:nth-child(-n+3), td:nth-child(-n+3) { text-align: left; }
  thead th { position: sticky; top: 0; background: #17202b; color: var(--dim); font-weight: 500; font-size: 12px;
    cursor: pointer; user-select: none; border-bottom: 1px solid var(--line); }
  thead th:hover { color: var(--text); }
  thead th.sorted { color: var(--accent); }
  tbody tr:nth-child(even) { background: var(--row); }
  tbody tr:hover { background: #1a2532; }
  td.code { color: var(--dim); }
  td.name { font-weight: 600; }
  .tag { font-size: 11px; padding: 1px 6px; border-radius: 4px; border: 1px solid var(--line); color: var(--dim); }
  .up { color: var(--up); } .down { color: var(--down); }
  .pecell { display: flex; align-items: center; justify-content: flex-end; gap: 8px; }
  .pebar { width: 60px; height: 6px; background: #223; border-radius: 3px; overflow: hidden; }
  .pebar i { display: block; height: 100%; background: var(--accent); }
  .empty { padding: 40px; text-align: center; color: var(--dim); }
  footer { color: var(--dim); font-size: 12px; padding: 14px 22px 28px; text-align: center; }
  .tabs { display: flex; gap: 6px; margin-bottom: 14px; }
  .tabs button { background: var(--panel); color: var(--dim); border: 1px solid var(--line); border-radius: 8px;
    padding: 8px 16px; font: inherit; font-weight: 600; cursor: pointer; }
  .tabs button.on { color: #111; background: var(--accent); border-color: var(--accent); }
  .killctl { display: none; border-color: #5a4300; }
  body.kill .killctl { display: flex; }
  .x { display: none; }
  body.kill .x { display: table-cell; }
  .hint { color: var(--dim); font-size: 12px; width: 100%; }
  td.ind { color: var(--dim); font-size: 12px; max-width: 120px; overflow: hidden; text-overflow: ellipsis; }
  td.news a { color: #6cb4ff; text-decoration: none; margin-left: 6px; font-size: 12px; }
  td.news a:hover { text-decoration: underline; }
  .abtn { background: #2a2210; color: var(--accent); border: 1px solid #5a4300; border-radius: 5px; padding: 2px 8px; font: inherit; font-size: 12px; cursor: pointer; }
  .abtn.v-likely { background: #10261a; color: var(--down); border-color: #1d5c3a; }
  .abtn.v-justified { background: #2a1214; color: var(--up); border-color: #6a2026; }
  tr.arow td { text-align: left; white-space: normal; background: #0d131a; padding: 14px 18px 18px; border-left: 3px solid var(--accent); }
  .ana { max-width: 900px; line-height: 1.7; }
  .ana h4 { margin: 12px 0 4px; font-size: 13px; color: var(--accent); }
  .ana h4:first-child { margin-top: 0; }
  .ana ul { margin: 2px 0; padding-left: 20px; }
  .ana .src a { color: #6cb4ff; }
  .ana .meta { color: var(--dim); font-size: 12px; margin-top: 10px; }
  @media (max-width: 760px) {
    .stats { grid-template-columns: repeat(2, 1fr); }
    header { flex-wrap: wrap; gap: 4px; padding: 12px 16px; }
    header h1 { white-space: nowrap; }
    .date { margin-left: 0; width: 100%; font-size: 12px; }
    main { padding: 14px 12px; }
  }
</style>
</head>
<body>
<header>
  <h1>台股 <span>本益比</span> 選股器</h1>
  <div class="date" id="date"></div>
</header>
<div class="ticker"><div class="ticker-inner" id="ticker"></div></div>

<main>
  <div class="tabs">
    <button id="tabPe" class="on">本益比選股</button>
    <button id="tabKill">錯殺候選</button>
  </div>

  <div class="stats">
    <div class="stat"><div class="k">符合條件檔數</div><div class="v" id="sCount">–</div></div>
    <div class="stat"><div class="k">平均本益比</div><div class="v" id="sPe">–</div></div>
    <div class="stat"><div class="k" id="s3k">平均殖利率</div><div class="v" id="sDy">–</div></div>
    <div class="stat"><div class="k">今日上漲 / 下跌</div><div class="v" id="sUd">–</div></div>
  </div>

  <div class="controls killctl">
    <label>距 60 日高點跌幅 ≥
      <select id="kdd"><option value="10">10%</option><option value="15">15%</option><option value="20" selected>20%</option><option value="25">25%</option><option value="30">30%</option></select>
    </label>
    <label>比大盤多跌 ≥
      <select id="krel"><option value="-999">不限</option><option value="0">0 個百分點</option><option value="5">5 個百分點</option><option value="10" selected>10 個百分點</option><option value="15">15 個百分點</option></select>
    </label>
    <label>營收月增 &gt;
      <select id="kmom"><option value="-999">不限</option><option value="0" selected>0%</option><option value="10">10%</option><option value="20">20%</option></select>
    </label>
    <div class="hint" id="khint"></div>
  </div>

  <div class="controls">
    <label>本益比 &lt;
      <input type="range" id="pe" min="1" max="60" step="0.5" value="20">
      <span class="pe-val" id="peVal">20</span>
    </label>
    <label>市場
      <select id="mkt"><option value="">全部</option><option>上市</option><option>上櫃</option></select>
    </label>
    <label>族群
      <select id="ind"><option value="">全部</option></select>
    </label>
    <label>殖利率 ≥ <input type="number" id="dy" min="0" step="0.5" value="0">%</label>
    <label>股價淨值比 ≤
      <select id="pb"><option value="">不限</option><option value="0.8">0.8</option><option value="1">1</option><option value="1.5">1.5</option><option value="2">2</option><option value="3">3</option><option value="5">5</option></select>
    </label>
    <label>市值 ≥
      <select id="mc"><option value="0">不限</option><option value="20">20 億</option><option value="50" selected>50 億</option><option value="100">100 億</option><option value="300">300 億</option><option value="1000">1000 億</option></select>
    </label>
    <label>成交量 ≥
      <select id="vq"><option value="0">不限</option><option value="100">100 張</option><option value="500" selected>500 張</option><option value="1000">1,000 張</option><option value="5000">5,000 張</option></select>
    </label>
    <label><input type="search" id="q" placeholder="搜尋代號或名稱"></label>
  </div>

  <div class="hist">
    <h3>全市場本益比分布（黃色 = 目前篩選範圍；無獲利／虧損公司不列入）</h3>
    <div class="bars" id="bars"></div>
    <div class="axis"><span>0</span><span>15</span><span>30</span><span>45</span><span>60+</span></div>
  </div>

  <div class="tablewrap">
    <table>
      <thead><tr>
        <th data-k="c">代號</th><th data-k="n">名稱</th><th data-k="ind">族群</th>
        <th data-k="px">收盤價</th><th data-k="chp">漲跌幅</th>
        <th data-k="dd" class="x">距高點</th><th data-k="rel" class="x">比大盤</th>
        <th data-k="mom" class="x">營收月增</th><th data-k="yoy" class="x">營收年增</th>
        <th data-k="pe">本益比</th><th data-k="dy">殖利率%</th><th data-k="pb">淨值比</th><th data-k="mc">市值(億)</th><th data-k="vol">成交量(張)</th>
        <th data-k="">新聞</th><th data-k="" class="x">Claude 分析</th>
      </tr></thead>
      <tbody id="tb"></tbody>
    </table>
  </div>
</main>
<footer>資料來源：臺灣證券交易所、證券櫃檯買賣中心 OpenAPI。本益比為交易所公布之數值；虧損公司無本益比，不會出現在清單中。<br>「錯殺候選」只是依股價跌幅與營收變化篩出的名單，下跌可能另有原因，請自行查看新聞與財報判斷。僅供參考，非投資建議。</footer>

<script>
const D = window.STOCK_DATA;
const $ = id => document.getElementById(id);
const rows = D.rows.map(r => ({ ...r,
  chp: (r.px != null && r.ch != null && r.px - r.ch) ? r.ch / (r.px - r.ch) * 100 : null,
  vol: r.vol != null ? Math.round(r.vol / 1000) : null }));
const valid = rows.filter(r => r.pe > 0);
$('date').textContent = '資料日期 ' + D.date + '　·　共 ' + rows.length + ' 檔（有本益比 ' + valid.length + ' 檔）';
$('khint').textContent = `距高點：現價比近 ${D.histDays || 60} 個交易日最高收盤跌了多少　·　比大盤：跌幅比同期加權指數多幾個百分點　·　營收月增：${D.revMonth || '最新'} 月營收比上月　·　注意：月增會受季節（如農曆年、工作天數）影響`;

[...new Set(valid.map(r => r.ind).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'zh-Hant'))
  .forEach(n => $('ind').insertAdjacentHTML('beforeend', `<option>${n}</option>`));

let kill = false, sortK = 'pe', sortDir = 1;

// ---------- Claude 每日分析（雲端排程產生 analysis.json） ----------
let ANA = null;
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const VERDICT = { likely: '可能錯殺', justified: '下跌有理', unclear: '資訊不足' };
fetch('analysis.json', { cache: 'no-store' }).then(r => r.ok ? r.json() : null).then(j => { ANA = j; render(); }).catch(() => {});
function anaBtn(r) {
  const a = ANA && ANA.stocks && ANA.stocks[r.c];
  if (!a) return '<span class="code">–</span>';
  return `<button class="abtn v-${esc(a.verdict)}" data-c="${r.c}">${VERDICT[a.verdict] || '看分析'} ▾</button>`;
}
function anaHtml(c) {
  const a = ANA.stocks[c];
  const list = xs => xs && xs.length ? '<ul>' + xs.map(x => `<li>${esc(x)}</li>`).join('') + '</ul>' : '<p>–</p>';
  return `<div class="ana">
    <h4>判斷：${esc(VERDICT[a.verdict] || a.verdict)}</h4><p>${esc(a.summary)}</p>
    <h4>下跌可能原因</h4>${list(a.reasons)}
    <h4>底層邏輯</h4><p>${esc(a.logic)}</p>
    <h4>營收數字是否支持</h4><p>${esc(a.revenueCheck)}</p>
    <h4>待確認的風險</h4>${list(a.risks)}
    <h4>參考來源（請自行核對）</h4><ul class="src">${(a.sources || []).map(s => `<li><a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.title)}</a> <span class="code">${esc(s.publisher || '')} ${esc(s.date || '')}</span></li>`).join('')}</ul>
    <div class="meta">Claude 分析於 ${esc(ANA.generatedAt)}（資料日 ${esc(ANA.dataDate)}）。推論可能有誤，請以原始新聞與公司公告為準，非投資建議。</div>
  </div>`;
}
document.addEventListener('click', e => {
  const b = e.target.closest('.abtn'); if (!b) return;
  const tr = b.closest('tr'), next = tr.nextElementSibling;
  if (next && next.classList.contains('arow')) { next.remove(); return; }
  tr.insertAdjacentHTML('afterend', `<tr class="arow"><td colspan="16">${anaHtml(b.dataset.c)}</td></tr>`);
});
const fmt = (v, d = 2) => v == null ? '–' : v.toLocaleString('zh-TW', { minimumFractionDigits: d, maximumFractionDigits: d });
const cls = v => v > 0 ? 'up' : v < 0 ? 'down' : '';
const sign = v => v > 0 ? '▲' : v < 0 ? '▼' : '';
const pct = v => v == null ? '–' : (v > 0 ? '+' : '') + fmt(v, 1) + '%';

// 跑馬燈：成交量前 30 大
(function () {
  const top = [...rows].filter(r => r.vol).sort((a, b) => b.vol - a.vol).slice(0, 30);
  const html = top.map(r => `<b>${r.n}</b><span class="${cls(r.ch)}">${fmt(r.px)} ${sign(r.ch)}${fmt(Math.abs(r.ch ?? 0))}</span>`).join('');
  $('ticker').innerHTML = html + html;
})();

function filtered() {
  const pe = +$('pe').value, mkt = $('mkt').value, ind = $('ind').value, dy = +$('dy').value || 0;
  const pb = $('pb').value === '' ? Infinity : +$('pb').value;
  const mc = +$('mc').value, vq = +$('vq').value;
  const kdd = +$('kdd').value, krel = +$('krel').value, kmom = +$('kmom').value;
  const q = $('q').value.trim().toLowerCase();
  return valid.filter(r => r.pe < pe && (!mkt || r.m === mkt) && (!ind || r.ind === ind) && (r.dy ?? 0) >= dy && (r.pb ?? 0) <= pb &&
    (!mc || (r.mc ?? 0) >= mc) && (!vq || (r.vol ?? 0) >= vq) &&
    (!kill || (r.dd != null && r.dd <= -kdd && (krel <= -999 || (r.rel != null && r.rel <= -krel)) && (kmom <= -999 || (r.mom != null && r.mom > kmom)))) &&
    (!q || r.c.toLowerCase().includes(q) || r.n.toLowerCase().includes(q)));
}

function drawHist(pe) {
  const bins = new Array(30).fill(0);
  valid.forEach(r => bins[Math.min(29, Math.floor(r.pe / 2))]++);
  const max = Math.max(...bins);
  $('bars').innerHTML = bins.map((n, i) => {
    const lo = i * 2, label = i === 29 ? '58+' : `${lo}–${lo + 2}`;
    return `<div class="bar ${lo < pe ? 'on' : ''}" style="height:${Math.max(2, n / max * 100)}%" data-tip="本益比 ${label}：${n} 檔"></div>`;
  }).join('');
}

function newsLinks(r) {
  const g = 'https://news.google.com/search?q=' + encodeURIComponent(`${r.n} ${r.c} when:14d`) + '&hl=zh-TW&gl=TW&ceid=TW:zh-Hant';
  const y = `https://tw.stock.yahoo.com/quote/${r.c}.${r.m === '上市' ? 'TW' : 'TWO'}/news`;
  return `<a href="${g}" target="_blank" rel="noopener">Google</a><a href="${y}" target="_blank" rel="noopener">Yahoo</a>`;
}

function render() {
  const pe = +$('pe').value;
  $('peVal').textContent = pe;
  drawHist(pe);
  const list = filtered().sort((a, b) => {
    const x = a[sortK], y = b[sortK];
    if (x == null) return 1; if (y == null) return -1;
    return (typeof x === 'string' ? x.localeCompare(y) : x - y) * sortDir;
  });
  const avg = k => { const v = list.filter(r => r[k] != null); return v.length ? v.reduce((s, r) => s + r[k], 0) / v.length : null; };
  $('sCount').textContent = list.length;
  $('sPe').textContent = fmt(avg('pe'));
  $('s3k').textContent = kill ? '平均距高點跌幅' : '平均殖利率';
  $('sDy').textContent = !list.length ? '–' : kill ? fmt(avg('dd'), 1) + '%' : fmt(avg('dy')) + '%';
  $('sUd').innerHTML = `<span class="up">${list.filter(r => r.ch > 0).length}</span> / <span class="down">${list.filter(r => r.ch < 0).length}</span>`;
  document.querySelectorAll('thead th').forEach(th => {
    th.classList.toggle('sorted', !!th.dataset.k && th.dataset.k === sortK);
    th.textContent = th.textContent.replace(/ [▲▼]$/, '') + (th.dataset.k && th.dataset.k === sortK ? (sortDir > 0 ? ' ▲' : ' ▼') : '');
  });
  if (!list.length) { $('tb').innerHTML = '<tr><td colspan="16" class="empty">沒有符合條件的股票</td></tr>'; return; }
  $('tb').innerHTML = list.map(r => `<tr>
    <td class="code">${r.c}</td><td class="name">${r.n}</td><td class="ind" title="${r.ind || ''}">${r.ind || '–'}</td>
    <td class="${cls(r.ch)}">${fmt(r.px)}</td>
    <td class="${cls(r.ch)}">${r.chp == null ? '–' : sign(r.ch) + ' ' + fmt(Math.abs(r.chp)) + '%'}</td>
    <td class="x ${cls(r.dd)}">${pct(r.dd)}${r.hd ? ` <span class="code">(${r.hd}高)</span>` : ''}</td>
    <td class="x ${cls(r.rel)}">${r.rel == null ? '–' : (r.rel > 0 ? '+' : '') + fmt(r.rel, 1)}</td>
    <td class="x ${cls(r.mom)}">${pct(r.mom)}</td><td class="x ${cls(r.yoy)}">${pct(r.yoy)}</td>
    <td><div class="pecell"><div class="pebar"><i style="width:${Math.min(100, r.pe / pe * 100)}%"></i></div>${fmt(r.pe)}</div></td>
    <td>${fmt(r.dy)}</td><td>${fmt(r.pb)}</td><td>${r.mc == null ? '–' : fmt(r.mc, 0)}</td><td>${r.vol == null ? '–' : r.vol.toLocaleString()}</td>
    <td class="news">${newsLinks(r)}</td>
    <td class="x">${anaBtn(r)}</td>
  </tr>`).join('');
}

function setTab(k) {
  kill = k;
  document.body.classList.toggle('kill', kill);
  $('tabPe').classList.toggle('on', !kill); $('tabKill').classList.toggle('on', kill);
  sortK = kill ? 'dd' : 'pe'; sortDir = 1;
  render();
}
$('tabPe').onclick = () => setTab(false);
$('tabKill').onclick = () => setTab(true);
document.querySelectorAll('thead th').forEach(th => th.onclick = () => {
  if (!th.dataset.k) return;
  if (sortK === th.dataset.k) sortDir = -sortDir; else { sortK = th.dataset.k; sortDir = 1; }
  render();
});
['pe', 'mkt', 'ind', 'dy', 'pb', 'mc', 'vq', 'kdd', 'krel', 'kmom', 'q'].forEach(id => $(id).addEventListener('input', render));
if (location.hash === '#kill') setTab(true); else render();
</script>
</body>
</html>
